switch:
  - platform: restart
    name: "${friendly_name} restart"
    icon: "mdi:restart"
    id: canbus_controller_reboot

  - platform: template
    # Warning: candump logs EVERY CAN frame with a per-frame string build on the
    # loop task — it adds noticeable bus/log latency (see docs/candump.md §8).
    # Use only for short debug sessions; the mode resets to off on every reboot.
    name: "${friendly_name} candump debug"
    id: candump_debug_switch
    icon: "mdi:bug"
    entity_category: "diagnostic"
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - switch.turn_off: find_can_id_debug_switch
        - lambda: |-
            <% for h in toptronic_hubs %><% if loop.first %>id(${ h }).set_debug_mode(1);<% endif %><% endfor %>
    turn_off_action:
      then:
        - lambda: |-
            <% for h in toptronic_hubs %><% if loop.first %>id(${ h }).set_debug_mode(0);<% endif %><% endfor %>

  - platform: template
    # Warning: find can_id logs only 0x42/0x40 frames as WARN lines that also
    # land in the "main logs" text sensor. Use only for short debug sessions;
    # the mode resets to off on every reboot.
    name: "${friendly_name} find can_id debug"
    id: find_can_id_debug_switch
    icon: "mdi:magnify"
    entity_category: "diagnostic"
    restore_mode: ALWAYS_OFF
    turn_on_action:
      then:
        - switch.turn_off: candump_debug_switch
        - lambda: |-
            <% for h in toptronic_hubs %><% if loop.first %>id(${ h }).set_debug_mode(2);<% endif %><% endfor %>
    turn_off_action:
      then:
        - lambda: |-
            <% for h in toptronic_hubs %><% if loop.first %>id(${ h }).set_debug_mode(0);<% endif %><% endfor %>
