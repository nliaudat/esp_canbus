button:
  - platform: template
    name: "Force request BM 83-0-0 (Room actual)"
    icon: "mdi:refresh"
    on_press:
      then:
        - lambda: |-
            // Raw GET (0x40) to BM device 0x400 | 8 = 0x408.
            // can_id = (0x7F << 22) | ((GW 0x481 | 8) << 11) | 0x408
            std::vector<uint8_t> data = {0x01, 0x40, 0x53, 0x00, 0x00, 0x00};
            id(cbus).send_data(0x1FE44C08, true, data);

