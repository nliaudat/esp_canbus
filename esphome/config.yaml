# for flashing : press boot button for 2-3 seconds before the serial connection initialize
# After OTA update, the EN (reset) button must be pressed to run firmware
# do not use gpio12 (MTDI)

substitutions:
  name: canbus
  friendly_name: "CanBus Controller"

  ### canbus
  can_tx_pin: "GPIO22"  # GPIO5
  can_rx_pin: "GPIO21"  # GPIO4

  ### board
  board_type: az-delivery-devkit-v4  # nodemcu-32s, esp-wrover-kit

  ### time
  TZ: "Europe/Zurich"  # timezone

  ### toptronic hubs — used by board.yaml OTA pause/resume and button.yaml refresh all
  toptronic_hubs:
    - toptronic_BM
    - toptronic_HV

toptronic:

  - id: toptronic_BM  # display
    canbus_id: cbus  # the canbus bit_rate must be 50kbps
    device_type: BM
    device_addr: 8
    language: en
    # boot_refresh_delay: 30s  # optional; one-shot full refresh after boot; 0 disables it
    # max_pending_messages: 32  # optional; max concurrent multi-frame reassemblies (per hub)
    # max_pending_age: 5000ms  # optional; a pending message this old with no continuation is lost
    # cleanup_interval: 5000ms  # optional; interval between stale-fragment sweeps
    # max_refresh_per_loop: 8  # optional; retained for compatibility (pacing now uses refresh_gap_ms)
    # max_frames_per_message: 8  # optional; max total frames a start frame may claim
    # refresh_gap_ms: 50ms  # optional; min pause between GETs in an update_all() burst (spreads responses)
    # NOTE: read-only entities (sensor/text_sensor) poll at update_interval (default 30s, set in the presets).
    #       This is an entity-level key, not a hub key - write entities (number/select/button) never poll.

  - id: toptronic_HV  # HomeVent
    canbus_id: cbus  # the canbus bit_rate must be 50kbps. do not change name as it used in canbus.yaml
    device_type: HV  # WEZ, HV, BM (BD is an alias for BM and BM must be used)
    device_addr: 8  # defaults are : HV=8, BM=8, WEZ=1
    language: en  # de, en, fr, it
    # boot_refresh_delay: 30s  # optional; one-shot full refresh after boot; 0 disables it
    # max_pending_messages: 32  # optional; max concurrent multi-frame reassemblies (per hub)
    # max_pending_age: 5000ms  # optional; a pending message this old with no continuation is lost
    # cleanup_interval: 5000ms  # optional; interval between stale-fragment sweeps
    # max_refresh_per_loop: 8  # optional; retained for compatibility (pacing now uses refresh_gap_ms)
    # max_frames_per_message: 8  # optional; max total frames a start frame may claim
    # refresh_gap_ms: 50ms  # optional; min pause between GETs in an update_all() burst (spreads responses)
    # NOTE: read-only entities (sensor/text_sensor) poll at update_interval (default 30s, set in the presets).
    #       This is an entity-level key, not a hub key - write entities (number/select/button) never poll.

external_components:
  - source:
      type: local
      path: components

# Enable logging
logger:
  level: DEBUG  # NONE / ERROR / INFO / DEBUG / VERBOSE
  # baud_rate: 0  # to disable logging via UART (fully headless)
  logs:
    text_sensor: ERROR
    homeassistant.sensor: ERROR
    canbus: ERROR  # setting log level for canbus lower than INFO may crash  : esphome/issues#4051
    uptime: ERROR
    uptime.sensor: ERROR
    wifi_signal: ERROR
    wifi_signal.sensor: ERROR
    esp32.preferences: ERROR
    internal_temperature: ERROR
    esp-idf: ERROR
    select: ERROR
    number: ERROR
    sensor: INFO
    toptronic: INFO  # DEBUG for full frame details: [RES]/[SET]/[GET]/[UNK] + reassembly
  on_message:
    - level: WARN  # capture only WARN + ERROR messages from the toptronic component
      then:
        - lambda: |-
            if (strcmp(tag, "toptronic") == 0) {
              id(main_logs).publish_state(std::string(message));
            }

packages:
  wifi: !include packages/wifi.yaml
  board: !include packages/board.yaml
  time: !include packages/time.yaml
  canbus: !include packages/canbus.yaml
  sensors_others: !include packages/sensors_others.yaml
  switch: !include packages/switch.yaml
  button: !include packages/button.yaml
  debug: !include packages/debug.yaml

