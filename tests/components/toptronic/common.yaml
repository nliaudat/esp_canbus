esphome:
  name: toptronic-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../esphome/components


canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    language: en

  # Multi-hub regression guard: WEZ and HK share several preset entity names
  # (e.g. "Normal room temp. heating oper. (1)"), which must not collide once
  # the hub name prefix is applied.
  - id: tt_wez
    canbus_id: canbus_toptronic
    device_type: WEZ
    device_addr: 1
    language: en

  - id: tt_hk
    canbus_id: canbus_toptronic
    device_type: HK
    device_addr: 9
    language: en

  # GW exercises _sanitize_entity_name(): its preset name contains '/' (W/m2).
  - id: tt_gw
    canbus_id: canbus_toptronic
    device_type: GW
    device_addr: 12
    language: en

  # Same device type + different address: exercises the "<TYPE> <addr>" prefix
  # branch of _resolve_hub_prefix() (tt_hv2 names must not collide with tt_hv).
  - id: tt_hv2
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 9
    language: en

  # Explicit name_prefix containing '/': the composed name (prefix + preset name)
  # must be sanitized by _sanitize_entity_name(), otherwise ESPHome rejects the
  # '/' URL path separator (error from 2027.7).
  - id: tt_sol
    canbus_id: canbus_toptronic
    device_type: SOL
    device_addr: 16
    language: en
    name_prefix: "Floor/1"
