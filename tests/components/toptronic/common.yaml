esphome:
  name: toptronic-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../../esphome/components


canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    language: en
