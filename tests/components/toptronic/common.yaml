canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    language: en

  - id: tt_wez
    canbus_id: canbus_toptronic
    device_type: WEZ
    device_addr: 1
    language: en

  - id: tt_bm
    canbus_id: canbus_toptronic
    device_type: BM
    device_addr: 8
    language: en
